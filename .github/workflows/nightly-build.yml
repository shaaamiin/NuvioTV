name: Nightly Build Auto

on:
  schedule:
    # Esegue ogni giorno alle 3:00 AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permette di avviarlo manualmente con un click

permissions:
  contents: write

concurrency:
  group: nightly-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configura l'identità Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Imposta la firma di Debug
        # Specifichiamo di usare la firma di debug predefinita di Android
        run: echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"

      - name: Compila e Pubblica la Nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Genera il nome versione (stringa)
          VERSION_NAME=$(date +'%Y.%m.%d')-nightly
          
          # 2. Genera il codice versione (intero obbligatorio per Android)
          # Usiamo il numero della run di GitHub che è sempre crescente
          VERSION_CODE=${{ github.run_number }}
          
          # 3. Lanciamo lo script
          # Nota: VERSION_NAME va alla fine senza flag, è un argomento posizionale
          python3 scripts/release_beta.py \
            --publish \
            --version-code "$VERSION_CODE" \
            --extra-notes "🛠 **Nightly Build** generata automaticamente dal fork." \
            "$VERSION_NAME"
